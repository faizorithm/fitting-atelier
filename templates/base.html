
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitting Atelier</title>

    <style>
        @font-face {
            font-family: 'PerandoryCondensed';
            src: url("{{ url_for('static', filename='Perandory-Condensed.otf') }}");
        }

        @font-face {
            font-family: 'PerandoryRegular';
            src: url("{{ url_for('static', filename='Perandory-Regular.otf') }}");
        }

        @font-face {
            font-family: 'PerandorySemiCondensed';
            src: url("{{ url_for('static', filename='Perandory-Semi-Condensed.otf') }}");
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Georgia, serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* DARK BACKGROUND */
        body:not(.light) {
            background:
                #1a1410
                url("{{ url_for('static', filename='background.png') }}")
                center center / cover fixed no-repeat;
            color: #f0e6d3;
        }

        /* LIGHT BACKGROUND */
        body.light {
            background:
                linear-gradient(
                    rgba(255,245,240,0.25),
                    rgba(255,245,240,0.25)
                ),
                url("{{ url_for('static', filename='lightbackground.png') }}")
                center center / cover fixed no-repeat;
            color: #5b292b;
        }

        /* NAVBAR */
        nav {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 18px 40px;
            border-bottom: 1px solid;
        }

        nav .logo {
            font-family: 'PerandoryCondensed', Georgia, serif;
            font-size: 38px;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
        }

        nav .logo em {
            font-style: normal;
        }

        nav .by {
            display: block;
            font-family: 'PerandoryRegular', Georgia, serif;
            font-size: 15px;
            margin-top: 8px;
        }

        nav ul {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 28px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav ul a {
            font-family: 'PerandoryCondensed', Georgia, serif;
            font-size: 23px;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav .btn-nav {
            display: inline-block;
            padding: 10px 22px;
            border-radius: 9px;
            border: 1px solid;
        }

        #theme-toggle {
            font-family: 'PerandoryCondensed', Georgia, serif;
            font-size: 22px;
            padding: 9px 18px;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* DARK NAVBAR */
        body:not(.light) nav {
            background: #2a1f14;
            border-color: #c9a97a;
        }

        body:not(.light) nav .logo,
        body:not(.light) nav ul a {
            color: #f0e6d3;
        }

        body:not(.light) nav .logo em,
        body:not(.light) nav .by {
            color: #c9a97a;
        }

        body:not(.light) nav .btn-nav {
            background: #650f1c;
            color: #f0e6d3;
            border-color: #c9a97a;
        }

        body:not(.light) #theme-toggle {
            background: #650f1c;
            color: #f0e6d3;
            border: 1px solid #c9a97a;
        }

        /* LIGHT NAVBAR */
        body.light nav {
            background: #fff5f0;
            border-color: #b77b70;
        }

        body.light nav .logo,
        body.light nav ul a {
            color: #8b1e2d;
        }

        body.light nav .logo em,
        body.light nav .by {
            color: #b77b70;
        }

        body.light nav .btn-nav {
            background: #8b1e2d;
            color: #fff5f0;
            border-color: #b77b70;
        }

        body.light #theme-toggle {
            background: #8b1e2d;
            color: #fff5f0;
            border: 1px solid #b77b70;
        }

        nav ul a:hover {
            opacity: 0.75;
        }

        /* CONTENT */
        main {
            width: 100%;
            min-height: 70vh;
        }

        /* FOOTER */
        footer {
            padding: 28px 20px;
            text-align: center;
            border-top: 1px solid;
            font-family: 'PerandoryRegular', Georgia, serif;
            font-size: 17px;
        }

        body:not(.light) footer {
            background: #2a1f14;
            color: #c9a97a;
            border-color: #c9a97a;
        }

        body.light footer {
            background: #fff5f0;
            color: #8b1e2d;
            border-color: #b77b70;
        }

        /* MOBILE */
        @media (max-width: 700px) {
            nav {
                flex-direction: column;
                padding: 20px;
                gap: 20px;
            }

            nav .brand {
                text-align: center;
            }

            nav ul {
                justify-content: center;
                gap: 15px;
            }

            nav ul a {
                font-size: 20px;
            }
        }
    </style>

    <script>
        // Apply saved theme before the page renders
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light');
        }
    </script>

</head>

<body>

    <nav>
        <div class="brand">
            <a href="{{ url_for('home') }}" class="logo">
                Fitting <em>Atelier</em>
            </a>
            <span class="by">By Faiza Sarker</span>
        </div>

        <ul>
            <li>
                <a href="{{ url_for('home') }}">Home</a>
            </li>

            <li>
                <a href="{{ url_for('login') }}">Log In</a>
            </li>

            <li>
                <a href="{{ url_for('register') }}" class="btn-nav">
                    Register
                </a>
            </li>

            <li>
                <button type="button" id="theme-toggle" onclick="toggleTheme()">
                    Light
                </button>
            </li>
        </ul>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        Fitting Atelier &copy; 2026 | Designed by Faiza Sarker
    </footer>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light');

            const isLight = document.body.classList.contains('light');

            localStorage.setItem(
                'theme',
                isLight ? 'light' : 'dark'
            );

            document.getElementById('theme-toggle').textContent =
                isLight ? 'Dark' : 'Light';
        }

        // Restore saved theme on page load
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light');
            document.getElementById('theme-toggle').textContent = 'Dark';
        }
    </script>

</body>
</html>
